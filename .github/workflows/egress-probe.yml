name: egress-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install curl_cffi -q
      - name: probe authkit
        run: |
          python - <<'PY'
          from curl_cffi import requests
          s = requests.Session(impersonate='chrome136')
          for i in range(3):
              try:
                  b = s.get('https://cursor.com/api/auth/login?force_authkit=1', timeout=30, allow_redirects=True)
                  print('TRY', i, b.status_code, len(b.text), b.url[:100])
                  print('CF_CHALLENGE' if 'Just a moment' in b.text else 'CLEAN')
              except Exception as e:
                  print('TRY', i, 'ERR', e)
          PY
